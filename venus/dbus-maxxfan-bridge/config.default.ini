; The defaults. On the Pi the settings in use are /data/setupOptions/MaxxFanBridge/config.ini,
; created from this file at the first install; edit that one, then svc -t /service/dbus-maxxfan-bridge.
;
; One section per fan. The section name is the fan's id: it names the D-Bus service and the
; default MQTT topics. backend = vanturtle-wifi is a VanTurtle Smart Controller in the fan,
; on WiFi with MQTT (hardware/vanturtle-smart-controller.md). The driver has backends for
; other hardware too (archive/README.md).

[gui]
; Language of the card texts: nl (Nederlands) or en. Set the Venus OS display language
; to Nederlands as well, so the parts gui-v2 draws itself (Aan/Uit, menus) match.
language = nl
; Which cards the switch pane shows: native (Alle fans, Bed and Keuken as switch cards) or
; plugin (only the plugin card, which needs gui-v2 1.4.6 or later; see docs/ui.md). With plugin,
; a GUI that cannot load the plugin shows no fan controls, so switch only once you've seen it.
cards = native

[fan1]
name = Keuken
instance = 60
backend = vanturtle-wifi
; topic = maxxfan/fan1/vt      prefix typed into the controller's MQTT page (this is the default)

[fan2]
name = Bed
instance = 61
backend = vanturtle-wifi
; topic = maxxfan/fan2/vt

; Optional per fan. Set these after the bench checks (SETUP.md, steps 12 and 13).
;   on_opens_lid = yes|no          does switching on open a closed lid by itself? (default unknown)
;   lid_settle_s = 12              seconds for a full lid stroke, plus a margin
;   swap_direction = no            yes if Richting shows the opposite of the airflow
;   confirm_s = 10                 how long to wait for the controller to confirm a command
;   quiet_s = 2                    wait after the controller's last message before sending;
;                                  must be longer than the controller's Echo suppress setting

; ---- Presets: one card with a button per preset; one tap sets every fan it names ----
; What a fan does, per line:
;   off                   fan off, lid left as it is       off open / off closed: lid too
;   intake 30, exhaust 70 running at that speed, lid open    (a closed lid always means off)
;   auto                  the fan's own thermostat
;   keep                  this fan is not touched (also when the line is left out)
; fan1 is Keuken, fan2 is Bed. The words stay English; the names shown on screen are the
; name = lines. "Opslaan als" on the Alle fans card stores what the fan cards show into a
; preset. That copy is kept in presets.json next to this file and wins over the lines below;
; delete the file to go back to them.

[presets]
; gui-v2 sorts the cards alphabetically by title: "Alle fans" comes before Bed and Keuken,
; so this card is on the left. A name changed here only applies to a new card (a fresh
; install, or after removing the package); an existing card keeps its title
; (venus/README.md, "Your settings").
name = Alle fans
instance = 62

[preset cooking]
name = Koken
fan1 = exhaust 80          ; steam and smells out over the stove
fan2 = intake 30           ; fresh air in at the other end

[preset sleep]
name = Slapen
fan1 = exhaust 20          ; quiet, slow air change
fan2 = off open            ; no motor noise over the bed; lid open for air

[preset drive]
name = Rijden
fan1 = off closed
fan2 = off closed

[preset standard]
name = Standaard
fan1 = exhaust 40
fan2 = intake 40

[mqtt]
; The broker the controllers talk to. The driver runs on the Venus device itself, so the
; local broker needs no password whatever the security profile.
host = 127.0.0.1
port = 1883
; username =
; password =
